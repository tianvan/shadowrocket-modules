name: Validate modules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate local files
        shell: pwsh
        run: ./scripts/validate.ps1 -RequireDirectConfig
      - name: Validate upstream rules
        shell: pwsh
        run: ./scripts/validate.ps1 -CheckRemote -RequireDirectConfig
