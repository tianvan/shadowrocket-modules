# 默认直连基础配置：配合按需启用的分流模块使用。
# 社区配置核对与参数取舍见 docs/community-validation.md。

[General]
# 国内可直连的加密 DNS；解析失败时回退至当前网络的系统 DNS。
dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
fallback-dns-server = system
# 直连域名解析失败时不自动改走代理。
dns-direct-fallback-proxy = false
# 接受私有 IP 应答，不因它触发强制代理。
private-ip-answer = true
# 匹配代理的 UDP 请求，在节点不支持时拒绝，不回退直连。
udp-policy-not-supported-behaviour = REJECT

[Rule]
# 模块匹配规则优先；其余请求直连。
FINAL,DIRECT
